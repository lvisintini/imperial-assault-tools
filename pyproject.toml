[project]
name = "ia-tools"
version = "0.1.0"
description = "Tools to fill gaps in imperial-assault-data: scrape cards.boardwars.eu, audit it against the dataset, enter card data in the browser and import it."
readme = "README.md"
license = "MIT"
authors = [{ name = "Luis Visintini", email = "lvisintini@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "jsonref>=1.1",
    "jsonschema>=4.23",
    "numpy>=2",
    "opencv-python-headless>=4.10",
    "parsel>=1.9",
    "pillow>=11",
    "requests>=2.32",
    "tinify>=1.6",
]

[project.scripts]
ia = "ia_tools.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ia_tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
